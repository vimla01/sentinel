name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest-cov black pylint
      - run: python -m black --check services/
      - run: python -m pylint services/
      - run: python -m pytest tests -q --cov=services --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: hello
            context: services/hello
            dockerfile: services/hello/Dockerfile
          - name: demo-api
            context: services/demo_api
            dockerfile: services/demo_api/Dockerfile
          - name: predictor
            context: .
            dockerfile: services/predictor/Dockerfile
          - name: diagnosis-agent
            context: .
            dockerfile: services/diagnosis_agent/Dockerfile
          - name: remediator
            context: .
            dockerfile: services/remediator/Dockerfile
          - name: api
            context: .
            dockerfile: services/api/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
