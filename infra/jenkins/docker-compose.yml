services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel/jenkins:local
    container_name: sentinel-jenkins
    user: "1000:${DOCKER_GID:-117}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    environment:
      - JENKINS_OPTS=--httpPort=8080
      # Pipeline's SCM points at a local bind-mounted path (/workspace/sentinel), not a
      # real remote, since this pipeline runs entirely offline against the host repo.
      # The Git plugin blocks local-path checkouts by default as a security measure.
      - JAVA_OPTS=-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/workspace/sentinel:ro
    restart: unless-stopped

volumes:
  jenkins_home:
    name: sentinel_jenkins_home
