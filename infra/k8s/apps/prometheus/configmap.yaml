apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'demo-api'
        metrics_path: /metrics
        static_configs:
          - targets: ['demo-api:8080']
      - job_name: 'predictor'
        metrics_path: /metrics
        static_configs:
          - targets: ['predictor:8080']
