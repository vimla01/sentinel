apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnosis-agent
  labels:
    app.kubernetes.io/name: diagnosis-agent
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: diagnosis-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diagnosis-agent
        app.kubernetes.io/part-of: sentinel
    spec:
      serviceAccountName: sentinel-workload
      securityContext:
        runAsNonRoot: true
      containers:
        - name: diagnosis-agent
          image: sentinel/diagnosis-agent:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PREDICTOR_URL
              value: http://predictor:8080
            - name: OLLAMA_URL
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              value: tinyllama
            - name: LOKI_URL
              value: http://loki:3100
            - name: ARGOCD_URL
              value: http://argocd-server.argocd:80
            - name: ARGOCD_APP
              value: sentinel
            - name: TARGET_JOB
              value: demo-api
            - name: POLL_INTERVAL_SECONDS
              value: "15"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
