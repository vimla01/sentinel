apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    grafana_dashboard: "1"
data:
  demo-dashboard.json: |
    {
      "annotations": {"list": []},
      "panels": [
        {
          "type": "graph",
          "title": "Up (demo-api)",
          "targets": [
            {"expr": "up{job=\"demo-api\"}", "legendFormat": "up"}
          ],
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 6}
        },
        {
          "type": "graph",
          "title": "HTTP Requests (demo-api)",
          "targets": [
            {"expr": "http_requests_total", "legendFormat": "requests"}
          ],
          "gridPos": {"x": 0, "y": 6, "w": 12, "h": 6}
        }
      ],
      "title": "Demo API Overview",
      "schemaVersion": 16,
      "version": 1
    }
  incident-timeline.json: |
    {
      "annotations": {"list": []},
      "panels": [
        {
          "type": "state-timeline",
          "title": "Incident Timeline",
          "description": "One row per tracked incident (id shown in the legend), colored by lifecycle stage. Fed by the api gateway's sentinel_incident_stage_level gauge.",
          "targets": [
            {"expr": "sentinel_incident_stage_level", "legendFormat": "{{metric}} ({{incident_id}})"}
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"type": "value", "options": {"0": {"text": "Predicted", "color": "blue"}}},
                {"type": "value", "options": {"1": {"text": "Diagnosed", "color": "yellow"}}},
                {"type": "value", "options": {"2": {"text": "Awaiting Approval", "color": "orange"}}},
                {"type": "value", "options": {"3": {"text": "Denied", "color": "red"}}},
                {"type": "value", "options": {"4": {"text": "Remediation Started", "color": "purple"}}},
                {"type": "value", "options": {"5": {"text": "Remediated", "color": "green"}}},
                {"type": "value", "options": {"6": {"text": "Verifying", "color": "yellow"}}},
                {"type": "value", "options": {"7": {"text": "Resolved", "color": "green"}}},
                {"type": "value", "options": {"8": {"text": "Failed Verification", "color": "orange"}}},
                {"type": "value", "options": {"9": {"text": "Escalated", "color": "dark-red"}}},
                {"type": "value", "options": {"10": {"text": "Failed", "color": "dark-red"}}}
              ]
            }
          },
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 10}
        },
        {
          "type": "bargauge",
          "title": "Incidents by Stage",
          "description": "Current count of tracked incidents in each lifecycle stage.",
          "targets": [
            {"expr": "sentinel_incidents_by_stage", "legendFormat": "{{stage}}"}
          ],
          "gridPos": {"x": 0, "y": 10, "w": 24, "h": 6}
        },
        {
          "type": "stat",
          "title": "Post-Remediation Verification Outcomes",
          "description": "Total verification outcomes tracked by SENTINEL.",
          "targets": [
            {"expr": "sum by (result) (sentinel_remediation_verification_total)", "legendFormat": "{{result}}"}
          ],
          "gridPos": {"x": 0, "y": 16, "w": 24, "h": 6}
        }
      ],
      "title": "Incident Timeline",
      "schemaVersion": 16,
      "version": 2
    }
  mumbai-air-quality.json: |
    {
      "annotations": {"list": []},
      "title": "Mumbai Air Quality & SDG 3 Health Telemetry",
      "description": "Real-time air quality metrics and pollutant concentrations across 8 Mumbai stations aligned with UN SDG 3 (Target 3.9).",
      "schemaVersion": 16,
      "version": 1,
      "panels": [
        {
          "type": "stat",
          "title": "City Average AQI",
          "targets": [{"expr": "avg(sentinel_air_quality_aqi)", "legendFormat": "Average AQI"}],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 50},
                  {"color": "orange", "value": 100},
                  {"color": "red", "value": 150},
                  {"color": "purple", "value": 200},
                  {"color": "dark-red", "value": 300}
                ]
              }
            }
          },
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 6}
        },
        {
          "type": "stat",
          "title": "Average PM2.5 (μg/m³)",
          "targets": [{"expr": "avg(sentinel_air_quality_pm25)", "legendFormat": "Average PM2.5"}],
          "fieldConfig": {
            "defaults": {
              "unit": "µg/m³",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 30},
                  {"color": "orange", "value": 60},
                  {"color": "red", "value": 90}
                ]
              }
            }
          },
          "gridPos": {"x": 8, "y": 0, "w": 8, "h": 6}
        },
        {
          "type": "stat",
          "title": "Average PM10 (μg/m³)",
          "targets": [{"expr": "avg(sentinel_air_quality_pm10)", "legendFormat": "Average PM10"}],
          "fieldConfig": {
            "defaults": {
              "unit": "µg/m³",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 50},
                  {"color": "orange", "value": 100},
                  {"color": "red", "value": 150}
                ]
              }
            }
          },
          "gridPos": {"x": 16, "y": 0, "w": 8, "h": 6}
        },
        {
          "type": "bargauge",
          "title": "Station AQI Comparison",
          "targets": [{"expr": "sentinel_air_quality_aqi", "legendFormat": "{{station}} ({{zone}})"}],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 350,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 50},
                  {"color": "orange", "value": 100},
                  {"color": "red", "value": 150},
                  {"color": "purple", "value": 200},
                  {"color": "dark-red", "value": 300}
                ]
              }
            }
          },
          "gridPos": {"x": 0, "y": 6, "w": 24, "h": 8}
        },
        {
          "type": "graph",
          "title": "PM2.5 Concentrations by Station",
          "targets": [{"expr": "sentinel_air_quality_pm25", "legendFormat": "{{station}}"}],
          "gridPos": {"x": 0, "y": 14, "w": 12, "h": 7}
        },
        {
          "type": "graph",
          "title": "PM10 Concentrations by Station",
          "targets": [{"expr": "sentinel_air_quality_pm10", "legendFormat": "{{station}}"}],
          "gridPos": {"x": 12, "y": 14, "w": 12, "h": 7}
        }
      ]
    }
