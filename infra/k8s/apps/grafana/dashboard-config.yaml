apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    grafana_dashboard: "1"
data:
  demo-dashboard.json: |
    {
      "annotations": {"list": []},
      "panels": [
        {
          "type": "graph",
          "title": "Up (demo-api)",
          "targets": [
            {"expr": "up{job=\"demo-api\"}", "legendFormat": "up"}
          ],
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 6}
        },
        {
          "type": "graph",
          "title": "HTTP Requests (demo-api)",
          "targets": [
            {"expr": "http_requests_total", "legendFormat": "requests"}
          ],
          "gridPos": {"x": 0, "y": 6, "w": 12, "h": 6}
        }
      ],
      "title": "Demo API Overview",
      "schemaVersion": 16,
      "version": 1
    }
