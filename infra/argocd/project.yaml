apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sentinel
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: sentinel
      server: https://kubernetes.default.svc
    - namespace: sentinel-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
